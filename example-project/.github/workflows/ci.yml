name: ci
# One pipeline, five sub-practices - the CI/CD tile from the article made real:
#   quality gates -> policy-as-code -> security scanning (OWASP + SBOM) -> IaC -> GitOps
on:
  push: { branches: [master] }
  pull_request: {}

permissions:
  contents: read

jobs:
  quality-gates:
    # spec-first + automated testing: regenerate from the contract, then lint and test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
      - run: make verify   # generate + lint + test + fail if generated code is stale

  policy-as-code:
    # declarative rules the pipeline must satisfy, checked with conftest/OPA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-conftest@v2
      - run: conftest test .github/workflows/ci.yml --policy policy/

  security-scan:
    # OWASP dependency posture + a CycloneDX SBOM, scanned for known CVEs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json, output-file: sbom.json }
      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v4
        with: { sbom: sbom.json, fail-build: true, severity-cutoff: high }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }

  infra-validate:
    # IaC as a declarative, validated artifact. Never `apply` from CI here -
    # GitOps (below) reconciles the cluster; CI only proves the plan is sound.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  gitops-deploy:
    # GitOps: CI does not push to the cluster. It bumps the image tag in the
    # environment repo; Argo CD reconciles the desired state from git.
    needs: [quality-gates, policy-as-code, security-scan, infra-validate]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - run: echo "bump image tag in the env repo; Argo CD reconciles from git"
